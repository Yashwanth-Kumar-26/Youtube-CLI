[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-cli"
version = "1.0.0"
description = "Terminal-native YouTube client (requires: mpv, chafa, yt-dlp)"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.1",
    "textual>=0.52.0",
    "httpx>=0.27.0",
]

[project.scripts]
yt-cli = "yt_cli:main"

[tool.setuptools.packages.find]
include = ["yt_cli", "yt_cli.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["scratch"]
asyncio_mode = "auto"
