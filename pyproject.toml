[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-tui"
version = "1.0.0"
description = "Terminal-native YouTube client — search, preview, and stream videos, no API key needed"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Yashwanth Kumar", email = "yashwanthkumarniat@gmail.com" },
]
keywords = ["youtube", "tui", "terminal", "yt-dlp", "mpv", "streaming"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "yt-dlp>=2024.1.1",
    "textual>=0.52.0",
    "httpx>=0.27.0",
    "py7zr>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/yashwanth-kumar-26/yt-tui"
Repository = "https://github.com/yashwanth-kumar-26/yt-tui"
"Bug Tracker" = "https://github.com/yashwanth-kumar-26/yt-tui/issues"

[project.scripts]
yt-tui = "yt_tui:main"
yt-incog = "yt_tui.cli:incog_main"

[tool.setuptools.packages.find]
include = ["yt_tui", "yt_tui.*"]

[tool.setuptools.package-data]
yt_tui = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["scratch"]
